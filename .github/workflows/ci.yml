name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4   # ✅ अपडेट

      - name: Setup Node
        uses: actions/setup-node@v4   # ✅ अपडेट
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Done
        run: echo "Build successful"